<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1e1e2e;
    color: #cdd6f4;
    font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
    font-size: 16px;
    line-height: 1.5;
    padding: 0;
  }
  #terminal {
    background: #1e1e2e;
    width: 1920px;
    height: 1080px;
    padding: 20px 30px;
    overflow: hidden;
  }
  .titlebar {
    background: #313244;
    border-radius: 10px 10px 0 0;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 0;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .dot-red { background: #f38ba8; }
  .dot-yellow { background: #f9e2af; }
  .dot-green { background: #a6e3a1; }
  .titlebar-text {
    color: #a6adc8;
    font-size: 13px;
    margin-left: 10px;
  }
  #content {
    background: #11111b;
    border-radius: 0 0 10px 10px;
    padding: 20px 24px;
    height: 980px;
    overflow: hidden;
  }
  .line { margin-bottom: 2px; white-space: pre-wrap; word-wrap: break-word; }
  .command { color: #a6e3a1; font-weight: bold; }
  .comment { color: #6c7086; font-style: italic; }
  .output { color: #cdd6f4; }
  .highlight { color: #89b4fa; }
  .pass { color: #a6e3a1; font-weight: bold; }
  .fail { color: #f38ba8; font-weight: bold; }
  .tool { color: #f9e2af; }
  .cursor {
    display: inline-block;
    width: 9px;
    height: 18px;
    background: #cdd6f4;
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>
<div id="terminal">
  <div class="titlebar">
    <span class="dot dot-red"></span>
    <span class="dot dot-yellow"></span>
    <span class="dot dot-green"></span>
    <span class="titlebar-text">sfagent-dev - Claude Code + SFAgent Tools</span>
  </div>
  <div id="content"></div>
</div>
<script>
  const content = document.getElementById('content');

  window.addLine = function(text, className) {
    const line = document.createElement('div');
    line.className = 'line ' + (className || '');
    line.innerHTML = text;
    content.appendChild(line);
    // Auto-scroll
    content.scrollTop = content.scrollHeight;
  };

  window.clearTerminal = function() {
    content.innerHTML = '';
  };

  window.addCursor = function() {
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    cursor.id = 'active-cursor';
    const lastLine = content.lastElementChild;
    if (lastLine) lastLine.appendChild(cursor);
  };

  window.removeCursor = function() {
    const c = document.getElementById('active-cursor');
    if (c) c.remove();
  };
</script>
</body>
</html>
